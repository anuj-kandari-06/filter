<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Filter</title>
</head>

<body>

    <!-- filter accordion start here-->
    <section class="header">
        <div class="container">
            <div class="row">
                <div class="col-md-3 bg-section">

                    <!-- heading start -->
                    <h4>Filter</h4>
                    <!-- heading close -->

                    <div id="filterAccordion">
                        <div class="mb-3">
                            <!-- Brand section start here-->
                            <button class="btn w-100 d-flex justify-content-between align-items-center bg-light p-3"
                                type="button" data-bs-toggle="collapse" data-bs-target="#brandFilter">
                                <span class="fs-20 fw-normal">Brand</span>
                                <i class="fa-solid fa-angle-down"></i>
                            </button>
                            <div class="collapse show" id="brandFilter" data-bs-parent="#filterAccordion">
                                <div class="list-group mt-3">
                                    <label class="fs-20 list-group-item border-0">
                                        <input class="form-check-input me-2" type="checkbox">
                                        Nike
                                    </label>
                                    <label class="fs-20 list-group-item border-0">
                                        <input class="form-check-input me-2" type="checkbox">
                                        Adidas
                                    </label>
                                    <label class="fs-20 list-group-item border-0">
                                        <input class="form-check-input me-2" type="checkbox">
                                        Asics
                                    </label>
                                    <label class="fs-20 list-group-item border-0">
                                        <input class="form-check-input me-2" type="checkbox">
                                        Puma
                                    </label>
                                    <label class="fs-20 list-group-item border-0">
                                        <input class="form-check-input me-2" type="checkbox">
                                        Bata
                                    </label>
                                </div>
                            </div>
                        </div>
                        <!-- Brand section start here-->

                        <!-- Gender section start here -->
                        <div class="mb-3">
                            <button class="btn w-100 d-flex justify-content-between align-items-center bg-light p-3"
                                type="button" data-bs-toggle="collapse" data-bs-target="#genderFilter">
                                <span class="fs-20 fw-normal">Gender</span>
                                <i class="fa-solid fa-angle-down"></i>
                            </button>
                            <div class="collapse" id="genderFilter" data-bs-parent="#filterAccordion">
                                <div class="list-group mt-3">
                                    <!--  -->
                                    <label class="fs-20 list-group-item border-0">
                                        <input class="form-check-input gender-radio me-2" type="radio" name="gender">
                                        Male
                                    </label>
                                    <label class="fs-20 list-group-item border-0">
                                        <input class="form-check-input gender-radio me-2" type="radio" name="gender">
                                        Female
                                    </label>
                                </div>
                            </div>

                        </div>
                    </div>
                    <!-- Gender section start here -->

                    <!-- Price section start here -->
                    <div class="mt-3">

                        <!-- Price Header -->
                        <div class="mb-3">
                            <!-- Price Header -->
                            <button class="btn w-100 d-flex justify-content-between align-items-center bg-light p-3"
                                type="button" data-bs-toggle="collapse" data-bs-target="#priceFilter"
                                aria-expanded="false" aria-controls="priceFilter">

                                <span class="fs-20 fw-normal">Price range</span>
                                <i class="fa-solid fa-angle-down"></i>
                            </button>

                            <!-- Price Filter Content -->
                            <div class="collapse" id="priceFilter" data-bs-parent="#filterAccordion">

                                <!-- Range Slider -->
                                <input type="range" class="form-range mt-3" min="500" max="10000" step="100" value="500"
                                    id="customRange2">

                                <!-- Price Values -->
                                <div class="d-flex justify-content-between">
                                    <span>₹500</span>
                                    <span id="priceValue">₹500</span>
                                </div>

                                <!-- Min Max -->
                                <div class="row mt-4">
                                    <div class="col-6">
                                        <select class="fs-20 form-select">
                                            <option selected>Min</option>
                                            <option>₹500</option>
                                            <option>₹1000</option>
                                            <option>₹2000</option>
                                        </select>
                                    </div>

                                    <div class="col-6">
                                        <select class="fs-20 form-select">
                                            <option selected>Max</option>
                                            <option>₹5000</option>
                                            <option>₹10000</option>
                                        </select>
                                    </div>
                                </div>

                            </div>
                        </div>
                        <!-- Price section close here -->
                    </div>
                    </div>
                    <!-- images section start here -->
                    <div class="col-md-9">
                        <div class="row g-4">
                            <div class="col-6 col-md-3">
                                <img src="images/shose-img.png" class="img-fluid w-100" alt=" shose product">
                            </div>
                            <div class="col-6 col-md-3">
                                <img src="images/shose-img.png" class="img-fluid w-100" alt="shose product">
                            </div>
                            <div class="col-6 col-md-3">
                                <img src="images/shose-img.png" class="img-fluid w-100" alt="shose product">
                            </div>
                            <div class="col-6 col-md-3">
                                <img src="images/shose-img.png" class="img-fluid w-100" alt="shose product">
                            </div>
                            <div class="col-6 col-md-3">
                                <img src="images/shose-img.png" class="img-fluid w-100" alt="shose product">
                            </div>
                            <div class="col-6 col-md-3">
                                <img src="images/shose-img.png" class="img-fluid w-100" alt="shose product">
                            </div>
                            <div class="col-6 col-md-3">
                                <img src="images/shose-img.png" class="img-fluid w-100" alt="shose product">
                            </div>
                            <div class="col-6 col-md-3">
                                <img src="images/shose-img.png" class="img-fluid w-100" alt="shose product">
                            </div>
                        </div>
                    </div>
                    <!-- images section close  here -->
                


            </div>
        </div>
        </div>
        </div>
    </section>





    <!-- filter accordion close here -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <title>Filter</title>
</head>

<body>
    <!-- Header text section -->
    <section>
        <div class="container">
            <h4>Filter</h4>
        </div>
    </section>


    <!-- Brand section start here -->
    <section>
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <div class="d-flex justify-content-between align-items-center bg-light p-3">
                        <span>Brand</span>
                        <i class="fa-solid fa-angle-down"></i>
                    </div>
                </div>
                <div class="list-group mt-3">

                    <label class="list-group-item border-0">
                        <input class="form-check-input me-2" type="checkbox">
                        Nike
                    </label>

                    <label class="list-group-item border-0">
                        <input class="form-check-input me-2" type="checkbox">
                        Adidas
                    </label>

                    <label class="list-group-item border-0">
                        <input class="form-check-input me-2" type="checkbox">
                        Asics
                    </label>

                    <label class="list-group-item border-0">
                        <input class="form-check-input me-2" type="checkbox">
                        Puma
                    </label>

                    <label class="list-group-item border-0">
                        <input class="form-check-input me-2" type="checkbox">
                        Bata
                    </label>

                </div>

            </div>

        </div>
    </section>

    <!-- Brand section close here -->

    <!--Gender section start here-->
    <section class="gender">
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <div class="d-flex justify-content-between align-items-center bg-light p-3">
                        <span>Gender</span>
                        <i class="fa-solid fa-angle-down"></i>
                    </div>
                </div>
                <div class="list-group mt-3">

                    <label class="list-group-item border-0">
                        <input class="form-check-input me-2" type="checkbox">
                        Male
                    </label>

                    <label class="list-group-item border-0">
                        <input class="form-check-input me-2" type="checkbox">
                        Female
                    </label>

                </div>
            </div>
    </section>
    <!--Gender section close here-->

    <!--  -->

    <section>
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <div class="d-flex justify-content-between align-items-center bg-light p-3">
                        <span class="fs-4">Price</span>
                        <i class="fa-solid fa-angle-down fs-4"></i>
                    </div>

                    <div class="row mt-4">

                        <div class="col-6">
                            <select class="form-select">
                                <option selected>Min</option>
                                <option>₹500</option>
                                <option>₹1000</option>
                            </select>
                        </div>

                        <div class="col-6">
                            <select class="form-select">
                                <option selected>Max</option>
                                <option>₹5000</option>
                                <option>₹10000</option>
                            </select>
                        </div>

                    </div>

                </div>

    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
